<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scraper</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mute:#5b6b78;--line:#c9d2da;--card:#fff;--acc:#0f6b8f;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
main{max-width:640px;margin:auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,button{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{background:var(--acc);color:#fff;border:0;font-weight:600;margin-top:16px;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
button:disabled{opacity:.6}
#status{margin:16px 0 8px;color:var(--mute)}
#status.err{color:var(--err)}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:50vh;font:13px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
#actions{display:none;gap:8px;margin-top:8px}
#actions button{margin-top:0}
</style>
</head>
<body>
<main>
<h1>Scraper</h1>
<p class="sub">Extrais le contenu d'une page web et exporte-le.</p>

<label for="url">Adresse de la page</label>
<input id="url" type="url" inputmode="url" placeholder="https://exemple.com/news" autocomplete="off">

<label for="sel">Sélecteur CSS (facultatif)</label>
<input id="sel" placeholder="ex. h2, .titre, article a" autocomplete="off">

<div class="row">
  <div>
    <label for="attr">Valeur à extraire</label>
    <select id="attr">
      <option value="text">Texte</option>
      <option value="href">Lien (href)</option>
      <option value="src">Image (src)</option>
      <option value="html">HTML</option>
    </select>
  </div>
  <div>
    <label for="limit">Maximum</label>
    <input id="limit" type="number" value="200" min="1" max="1000">
  </div>
</div>

<button id="go">Lancer le scraping</button>
<button class="alt" id="paste">Sans sélecteur : titre, liens, images</button>

<div id="status" role="status"></div>
<pre id="out" hidden></pre>
<div id="actions" class="row">
  <button class="alt" id="json">Télécharger JSON</button>
  <button class="alt" id="csv">Télécharger CSV</button>
  <button class="alt" id="copy">Copier</button>
</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let result = null;

async function run(useSelector) {
  const url = $("url").value.trim();
  if (!url) return setStatus("Entre l'adresse d'une page.", true);
  const p = new URLSearchParams({ url, limit: $("limit").value, attr: $("attr").value });
  if (useSelector && $("sel").value.trim()) p.set("selector", $("sel").value.trim());
  $("go").disabled = true;
  setStatus("Chargement…");
  try {
    const r = await fetch("/api/scrape?" + p);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    result = j.data;
    const n = Array.isArray(result) ? result.length + " éléments" : "page analysée";
    setStatus(n + " (HTTP " + j.status + ")");
    $("out").hidden = false;
    $("out").textContent = JSON.stringify(result, null, 2);
    $("actions").style.display = "flex";
  } catch (e) {
    setStatus("Erreur : " + e.message, true);
  }
  $("go").disabled = false;
}
function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }
function save(name, type, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
}
function toCSV(d) {
  const rows = Array.isArray(d) ? d : [d];
  const flat = rows.map((x) => (typeof x === "object" && x ? x : { valeur: x }));
  const cols = [...new Set(flat.flatMap(Object.keys))];
  const q = (v) => '"' + String(Array.isArray(v) ? v.join(" | ") : v ?? "").replace(/"/g, '""') + '"';
  return "\ufeff" + [cols.join(","), ...flat.map((r) => cols.map((c) => q(r[c])).join(","))].join("\n");
}
$("go").onclick = () => run(true);
$("paste").onclick = () => { $("sel").value = ""; run(false); };
$("json").onclick = () => save("scrape.json", "application/json", JSON.stringify(result, null, 2));
$("csv").onclick = () => save("scrape.csv", "text/csv", toCSV(result));
$("copy").onclick = () => navigator.clipboard.writeText(JSON.stringify(result, null, 2)).then(() => setStatus("Copié"));
</script>
</body>
</html>
